name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build project
      run: dotnet build --no-restore
    - name: Run tests
      run: dotnet test --no-build --verbosity normal

  check-warnings:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Check for warnings
      run: |
        OUTPUT=$(dotnet build)
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -iq "warning CS"; then
          echo "::error::Attention, there is a warning here!"
          exit 1
        fi
